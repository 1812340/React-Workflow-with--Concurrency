name: React App Concurrency

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency: 
     group: deploy
     cancel-in-progress: true
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6.0.2
      - name: Install Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 22.x
      - name: Depedences install
        run: npm install
      - name: React App Build
        run : npm run build 
      - name: deploying the app 
        run: echo "deploying ......"
           

        

        

  
